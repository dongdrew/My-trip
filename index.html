<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0ea5b7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="보라카이" />
  <title>보라카이 가족여행</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1 id="tripTitle">보라카이 가족여행</h1>
      <p id="tripSub" class="muted"></p>
    </div>
    <button class="icon-btn" data-action="settings" aria-label="설정">⚙️</button>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="home"><span>🏠</span>홈</button>
    <button data-tab="schedule"><span>🗓️</span>일정</button>
    <button data-tab="bookings"><span>🎫</span>예약</button>
    <button data-tab="expenses"><span>💰</span>비용</button>
    <button data-tab="places"><span>📍</span>장소</button>
    <button data-tab="memories"><span>📸</span>추억</button>
  </nav>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button type="button" class="btn danger" id="modalDelete" hidden>삭제</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="modalCancel">취소</button>
        <button type="submit" class="btn primary" id="modalOk">저장</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden />

  <script src="app.js"></script>
</body>
</html>
